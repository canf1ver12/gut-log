<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>gut-log</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --ink2:#3c3c43; --muted:#8e8e93; --line:#e5e5ea; --lane:#f2f2f7; --fill:rgba(118,118,128,.12);
  --meal:#34c759; --meal-soft:rgba(52,199,89,.14); --done:#007aff; --done-soft:rgba(0,122,255,.12);
  --sym:#5856d6; --sym-soft:rgba(88,86,214,.12); --accent:#007aff; --red:#ff3b30;
  --warn:#c93400; --warn-bg:rgba(255,149,0,.14); --on-strong:#ffffff; --tabbar:rgba(249,249,249,.92);
  --on-meal:#fff; --on-sym:#fff; --on-accent:#fff; --seg-on:#ffffff; color-scheme:light;
}
:root[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf5; --muted:#8e8e93; --line:#38383a; --lane:#2c2c2e; --fill:rgba(118,118,128,.24);
    --meal:#30d158; --meal-soft:rgba(48,209,88,.18); --done:#0a84ff; --done-soft:rgba(10,132,255,.2);
    --sym:#5e5ce6; --sym-soft:rgba(94,92,230,.22); --accent:#0a84ff; --red:#ff453a;
    --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.16); --on-strong:#ffffff; --tabbar:rgba(22,22,24,.88);
    --seg-on:#636366; color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --ink2:#ebebf5; --muted:#8e8e93; --line:#38383a; --lane:#2c2c2e; --fill:rgba(118,118,128,.24);
    --meal:#30d158; --meal-soft:rgba(48,209,88,.18); --done:#0a84ff; --done-soft:rgba(10,132,255,.2);
    --sym:#5e5ce6; --sym-soft:rgba(94,92,230,.22); --accent:#0a84ff; --red:#ff453a;
    --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.16); --on-strong:#ffffff; --tabbar:rgba(22,22,24,.88);
    --seg-on:#636366; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
.num,.big b,.sumrow b,.stat .v,.scale-btn b{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang TC",sans-serif}

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 6px;max-width:560px;margin:0 auto}
.topbar .eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.topbar h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:.3px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(100px + env(safe-area-inset-bottom))}
.page{display:none} .page.active{display:block}
.section-h{font-size:22px;font-weight:700;margin:22px 4px 8px}

.big{width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;border-radius:16px;padding:18px 18px;margin:8px 0 10px;transition:transform .1s,opacity .1s}
.big:active{transform:scale(.985);opacity:.85}
.big-icon{grid-row:1 / span 2;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:28px;line-height:1;background:rgba(255,255,255,.22)}
.big-label{font-size:24px;font-weight:700}
.big-sub{font-size:14px;opacity:.88}
.meal-start{background:var(--meal);color:var(--on-meal);min-height:112px}
.meal-end{background:var(--accent);color:var(--on-accent);min-height:112px}
.meal-end b{font-size:22px;font-variant-numeric:tabular-nums}
.symptom{background:var(--sym);color:var(--on-sym);min-height:112px}

.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0}
.card-title{font-weight:600;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-title.meal{color:var(--meal)} .card-title.sym{color:var(--sym)} .card-title.blue{color:var(--accent)}
.card-title.meal::before,.card-title.sym::before,.card-title.blue::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.hint{font-weight:400;font-size:13px;color:var(--muted);margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;background:var(--fill);font-size:15px}
.chip.on{background:var(--meal);color:var(--on-meal);font-weight:600}
.chip.none.on{background:var(--ink2);color:var(--card)}
.symchips .chip.on{background:var(--sym);color:var(--on-sym)}
.chip .x{margin-left:6px;opacity:.55}

.ongoing{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--line)}
.ongoing:first-of-type{border-top:none}
.ongoing b{color:var(--ink);font-weight:600}
.pill{padding:7px 16px;border-radius:999px;background:var(--sym-soft);color:var(--sym);font-weight:600;font-size:15px;white-space:nowrap}

.sumrow{display:flex;gap:10px;margin-bottom:6px}
.sumrow div{flex:1;font-size:15px;color:var(--muted)}
.sumrow b{font-size:32px;font-weight:700;margin-right:4px;color:var(--ink)}
.sumrow div:first-child b{color:var(--meal)} .sumrow div:last-child b{color:var(--sym)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.m{background:var(--meal)} .dot.s{background:var(--sym)}
.item-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:96px}
.item-text{flex:1;font-size:15px}
.item::after{content:"";width:7px;height:7px;border-right:2px solid #c4c4c7;border-top:2px solid #c4c4c7;transform:rotate(45deg);margin-right:4px;flex:none}
.empty{text-align:center;padding:10px 0}
.dayhead{font-size:13px;color:var(--muted);margin:14px 0 2px;font-weight:600}

.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{font-weight:700;font-size:17px}
.navbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);font-size:20px;color:var(--accent);line-height:1}
.textbtn{padding:6px 12px;border-radius:999px;background:var(--fill);font-size:14px;color:var(--accent);font-weight:600}
svg.tl{width:100%;height:auto;display:block;margin-top:10px}
svg .grid{stroke:var(--line);stroke-width:.6}
svg .tick{fill:var(--muted);font-size:10px}
svg .lane{fill:var(--lane)}
svg .tl-meal{fill:var(--meal);stroke:var(--meal);stroke-width:1;cursor:pointer}
svg .tl-sym{fill:var(--sym);stroke:var(--card);stroke-width:1.5;cursor:pointer}
svg .tl-symdur{stroke:var(--sym);stroke-opacity:.3;stroke-width:5;stroke-linecap:round}
svg .nowline{stroke:var(--red);stroke-width:1;stroke-dasharray:3 3}
svg .lanelbl{fill:var(--muted);font-size:10.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btnrow > *{flex:1}

.primary{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:13px 16px;font-weight:600}
.secondary{background:var(--fill);color:var(--accent);border-radius:12px;padding:13px 16px;font-weight:600}
.danger{background:var(--fill);color:var(--red);border-radius:12px;padding:13px 16px;font-weight:600}
.ghost{width:100%;padding:12px;color:var(--accent);margin-top:6px;font-weight:500}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;padding:6px 6px;border-radius:7px;font-size:14px;min-width:52px;font-weight:500}
.seg button.on{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:26px;font-weight:700}
.stat .k{font-size:13px;color:var(--muted)}
table.slots{width:100%;border-collapse:collapse;font-size:15px}
table.slots th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;padding:4px 4px 6px}
table.slots td{padding:9px 4px;border-top:.5px solid var(--line);font-variant-numeric:tabular-nums}
.cmp{padding:14px 0;border-top:.5px solid var(--line)}
.cmp:first-of-type{border-top:none}
.cmp h3{margin:0 0 8px;font-size:16px;font-weight:600}
.bar{display:grid;grid-template-columns:118px 1fr 76px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bar .track{height:12px;background:var(--fill);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--sym);border-radius:6px}
.bar .fill.b{background:var(--muted);opacity:.5}
.bar .num{text-align:right;font-variant-numeric:tabular-nums}
.finding{font-size:14px;margin:8px 0 0;color:var(--ink2)}
.warn{display:inline-block;font-size:12px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:3px 8px;margin-top:8px}
.note{font-size:13px;color:var(--muted);padding:10px 4px 0;margin-top:6px}

.field{margin:12px 0}
.field label,.label{display:block;font-size:13px;color:var(--muted);margin:16px 4px 6px;font-weight:400;text-transform:none}
.input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:none;background:var(--fill)}
textarea{min-height:64px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:.5px solid var(--line);font-size:16px}
.setrow:first-of-type{border-top:none}
.setrow input{width:72px;text-align:center;padding:7px 8px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--tabbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--muted);opacity:.4;margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:700}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.scale-btn{display:flex;flex-direction:column;align-items:center;padding:14px 2px;border-radius:14px;color:var(--ink)}
.scale-btn b{font-size:28px;line-height:1.1;font-weight:700}
.scale-btn span{font-size:12px}
.f1{background:color-mix(in srgb,var(--meal) 14%,var(--card))}.f2{background:color-mix(in srgb,var(--meal) 32%,var(--card))}.f3{background:color-mix(in srgb,var(--meal) 52%,var(--card))}.f4{background:color-mix(in srgb,var(--meal) 78%,var(--card));color:var(--on-meal)}.f5{background:var(--meal);color:var(--on-meal)}
.i1{background:color-mix(in srgb,var(--sym) 14%,var(--card))}.i2{background:color-mix(in srgb,var(--sym) 32%,var(--card))}.i3{background:color-mix(in srgb,var(--sym) 52%,var(--card))}.i4{background:color-mix(in srgb,var(--sym) 78%,var(--card));color:var(--on-sym)}.i5{background:var(--sym);color:var(--on-sym)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt-grid button{background:var(--card);border-radius:12px;padding:14px 8px;font-weight:600;color:var(--accent)}
.opt-grid button:disabled{opacity:.35}
.opt-grid button.soft{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline .input{flex:1;background:var(--card)}
.sheet .input,.sheet textarea{background:var(--card)}
.sheet .chip{background:var(--card)}
.sheet .chip.on{background:var(--meal);color:var(--on-meal)} .sheet .symchips .chip.on{background:var(--sym);color:var(--on-sym)} .sheet .chip.none.on{background:var(--ink2)}

.minirow{display:flex;gap:8px;margin:-2px 0 10px}
.mini{flex:1;background:var(--card);border-radius:12px;padding:11px 8px;font-size:15px;font-weight:600;color:var(--accent)}
.themebtn{position:absolute;right:20px;bottom:10px;width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.themebtn svg{width:20px;height:20px}
.topbar{position:sticky}
.nowbtn{width:100%;margin-top:14px;padding:16px;font-size:18px;border-radius:14px}
.primary.nowbtn{background:var(--meal);color:var(--on-meal)}
.headline{font-size:17px;margin:2px 0 4px;line-height:1.5}
.headline b{color:var(--sym)}
.factor{padding:12px 0;border-top:.5px solid var(--line)}
.fhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:16px}
.rank{width:22px;height:22px;border-radius:50%;background:var(--sym);color:var(--on-sym);font-size:13px;font-weight:700;display:grid;place-items:center}
.lvl{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.lvl.hi{background:var(--sym-soft);color:var(--sym)} .lvl.mid{background:var(--fill);color:var(--ink2)} .lvl.few{background:var(--fill);color:var(--muted);font-weight:500}
.ten{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.ten .tl-lbl{color:var(--ink2)} .ten .tn{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--fill);flex:none}
.dots i.on{background:var(--sym)} .dots i.on2{background:var(--muted)}
.unclear{font-size:14px;color:var(--ink2);margin:12px 0 0;padding-top:12px;border-top:.5px solid var(--line)}
.unclear span{color:var(--muted)}
.avgv{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.raw{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.prog{display:grid;grid-template-columns:64px 1fr 40px 1fr 40px;align-items:center;gap:6px;font-size:13px;margin:6px 0}
.pbar{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--sym);border-radius:3px}
.phead{font-size:12px;color:var(--muted);margin-bottom:0}
.pn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.how{margin-top:12px;font-size:13px;color:var(--ink2)}.how summary{color:var(--accent);cursor:pointer;font-weight:600}.how p{margin:8px 0 0;line-height:1.6}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:rgba(30,30,32,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="topbar"><div class="eyebrow" id="eyebrow">gut-log</div><h1 id="pageTitle">摘要</h1><button class="themebtn" id="themeBtn" aria-label="切換深淺色"></button></header>

<main>
  <section id="page-home" class="page active"></section>
  <section id="page-timeline" class="page"></section>
  <section id="page-stats" class="page"></section>
  <section id="page-settings" class="page"></section>
</main>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-page="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.5 1.1 4.3 2.4h2c.8-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>摘要</button>
  <button class="tab" data-page="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>時間軸</button>
  <button class="tab" data-page="stats"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1.2"/><rect x="10" y="7" width="4" height="14" rx="1.2"/><rect x="17" y="3" width="4" height="18" rx="1.2"/></svg>趨勢</button>
  <button class="tab" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>設定</button>
</div></nav>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ========== 基本設定與資料 ========== */
const KEY = 'gut-log-v1';
const NONE = 'none';            // 「都沒有」標籤
const FAST_MIN = 25;            // 少於幾分鐘算吃太快
const MIN_N = 30;               // 樣本數門檻
const FULL = ['', '還很餓', '有點餓', '剛好', '有點撐', '很撐'];
const DEFAULTS = {
  reminderMinutes: 25, repeatMinutes: 10, lateHour: 20, symptomWindowHours: 3,
  theme: 'auto', colors: { meal: '#1E9E97', sym: '#D9822B', accent: '#2A86A3' },
  foodTags: ['炸的', '辣的', '甜點', '酸的', '乳製品'],
  symptomTags: ['火燒心', '胸口痛', '胃痛', '咳嗽', '想吐', '胸口悶', '脹氣']
};
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.meals)) {
      d.symptoms = d.symptoms || [];
      d.settings = Object.assign({}, DEFAULTS, d.settings || {});
      return d;
    }
  } catch (e) {}
  return { meals: [], symptoms: [], settings: Object.assign({}, DEFAULTS) };
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('儲存失敗，瀏覽器可能不允許儲存資料'); }
}

/* ========== 時間工具 ========== */
const WD = '日一二三四五六';
const ms = d => new Date(d).getTime();
const fmtHM = d => { d = new Date(d); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const startOfDay = d => { d = new Date(d); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtDay = d => { d = new Date(d); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; };
const fmtDur = t => { const m = Math.round(t / 60000); return m < 60 ? m + ' 分鐘' : Math.floor(m / 60) + ' 小時' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''); };
const fmtClock = t => { const s = Math.max(0, Math.floor(t / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x); };
const toLocalInput = iso => iso ? dayKey(iso) + 'T' + fmtHM(iso) : '';
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
const minOfDay = d => { d = new Date(d); return d.getHours() * 60 + d.getMinutes(); };
const fmtMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };

/* ========== 資料小工具 ========== */
const isActive = m => !m.end && !m.endUnknown;
const activeMeal = () => db.meals.filter(isActive).pop();
const durMs = m => (m.end && !m.endUnknown) ? ms(m.end) - ms(m.start) : null;
const tagLabel = t => t === NONE ? '都沒有' : t;

function mealText(m) {
  const p = [];
  if (isActive(m)) p.push('吃飯中');
  else if (m.endUnknown) p.push('結束時間不明');
  else p.push('吃了 ' + fmtDur(durMs(m)));
  if (m.fullness) p.push('飽 ' + m.fullness);
  if (m.tags && m.tags.length) p.push(m.tags.map(tagLabel).join('、'));
  return p.join(' · ');
}
function mealTimeText(m) {

}
function symText(s) {

}
function foodChips(selected) {

}
function toggleFood(tags, t) {

  return `<button class="item" data-kind="${e.k}" data-id="${o.id}"><span class="dot ${e.k}"></span><span class="item-time">${time}</span><span class="item-text">${esc(text)}</span></button>`;
}
const events = (meals, syms) => [
  ...meals.map(m => ({ t: ms(m.start), k: 'm', o: m })),

/* ========== 提示、彈出面板 ========== */

/* ========== F1 吃飯紀錄 ========== */
function startMeal(atIso) {

  const m = { id: uid(), start: st, end: null, fullness: null, tags: [], note: '', notified: dueCount(Date.now() - ms(st)) };
  db.meals.push(m); save(); renderCurrent(); tick();
  toast(atIso ? '從 ' + fmtHM(st) + ' 開始計時' : '開始計時，慢慢吃');
  askNotifPermission();

}
function finishMeal() {
  const a = activeMeal(); if (!a) return;

function askFullness(meal, done) {

/* ========== F2 提醒：分頁標題、通知、開啟時補登 ========== */
function tick() {
  const a = activeMeal();
  if (a) {
    const t = Date.now() - ms(a.start);
    const el = $('#timer'); if (el) el.textContent = fmtClock(t);
    document.title = '🍚 ' + fmtClock(t) + ' 吃飯中｜gut-log';
    checkNotify(a, t);
  } else {
    document.title = 'gut-log';
  }
}
function dueCount(t) {
  const st = db.settings, min = t / 60000;
  if (min < st.reminderMinutes) return 0;
  return 1 + Math.floor((min - st.reminderMinutes) / Math.max(1, st.repeatMinutes));
}
function checkNotify(a, t) {
  const due = dueCount(t);

  a.notified = due; save();
  const mins = Math.floor(t / 60000);
  const sent = notify('吃完了嗎？', '這餐已經 ' + mins + ' 分鐘了，吃完記得按「吃完了」');
  if (!document.hidden || !sent) toast('已經吃了 ' + mins + ' 分鐘，吃完記得按「吃完了」', 5000);
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
}
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  try {
    const n = new Notification(title, { body, tag: 'gut-log-meal', renotify: true });
    n.onclick = () => { window.focus(); n.close(); };
    return true;
  } catch (e) { return false; }
}
async function askNotifPermission() {
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  try { await Notification.requestPermission(); } catch (e) {}
}
function checkStaleMeal() {
  const a = activeMeal(); if (!a) return;
  const elapsed = Date.now() - ms(a.start);
  if (elapsed < db.settings.reminderMinutes * 60000) return;
  openSheet(s => {
    const opt = (m, label) => `<button data-m="${m}" ${ms(a.start) + m * 60000 > Date.now() ? 'disabled' : ''}>${label}</button>`;
    s.innerHTML = `<h2>上一餐還沒結束</h2>
      <p class="muted small">${fmtDay(a.start)} ${fmtHM(a.start)} 開始，已經過了 ${fmtDur(elapsed)}。大概幾點吃完的？</p>
      <div class="opt-grid">
        <button data-m="now">剛剛</button>${opt(20, '開始後 20 分鐘')}${opt(30, '開始後 30 分鐘')}${opt(45, '開始後 45 分鐘')}
      </div>
      <div class="inline"><input type="time" class="input" id="customEnd"><button class="secondary" id="customOk">用這個時間</button></div>
      <div class="opt-grid"><button class="soft" data-m="forgot">忘記了</button><button class="soft" data-m="still">我還在吃</button></div>`;
    const finish = iso => {
      a.end = iso; save(); closeSheet();
      askFullness(a, () => toast('已補登，吃了 ' + fmtDur(durMs(a))));
    };
    s.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      const m = b.dataset.m;
      if (m === 'still') { closeSheet(); return; }
      if (m === 'forgot') { a.endUnknown = true; a.end = null; save(); closeSheet(); askFullness(a, () => toast('已記錄，這餐時間標記為不明')); return; }
      if (m === 'now') { finish(new Date().toISOString()); return; }
      finish(new Date(ms(a.start) + (+m) * 60000).toISOString());
    });
    s.querySelector('#customOk').onclick = () => {
      const v = s.querySelector('#customEnd').value;
      if (!v) { toast('先選一個時間'); return; }
      const [h, mi] = v.split(':').map(Number);
      const d = new Date(a.start); d.setHours(h, mi, 0, 0);
      if (d.getTime() < ms(a.start)) d.setDate(d.getDate() + 1);
      if (d.getTime() > Date.now()) { toast('這個時間還沒到喔'); return; }
      finish(d.toISOString());
    };
  });
}

const askedThisSession = new Set();

/* ========== 外觀：深淺色切換與固定配色 ========== */
const hexRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const lum = h => { const c = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const onColor = h => lum(h) > .5 ? '#1c1c1e' : '#ffffff';
const soft = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
const THEME_NAME = { auto: '跟隨系統', light: '淺色', dark: '深色' };
function applyTheme() {
  const st = db.settings, r = document.documentElement, c = DEFAULTS.colors;
  if (st.theme === 'light' || st.theme === 'dark') r.dataset.theme = st.theme; else delete r.dataset.theme;
  r.style.setProperty('--meal', c.meal); r.style.setProperty('--meal-soft', soft(c.meal, .16)); r.style.setProperty('--on-meal', onColor(c.meal));
  r.style.setProperty('--sym', c.sym); r.style.setProperty('--sym-soft', soft(c.sym, .16)); r.style.setProperty('--on-sym', onColor(c.sym));
  r.style.setProperty('--accent', c.accent); r.style.setProperty('--done', c.accent); r.style.setProperty('--on-accent', onColor(c.accent));
  const b = $('#themeBtn'); if (b) { b.innerHTML = THEME_ICON[st.theme] || THEME_ICON.auto; b.title = '外觀：' + THEME_NAME[st.theme]; }
}

/* ========== F4 時間軸 + F7 紀錄管理 ========== */
let tlDay = startOfDay(Date.now()), showAll = false, allLimit = 60;
function timelineSVG(d0) {
  const d1 = d0 + 864e5, now = Date.now(), W = 360, L = 40, R = 10, span = W - L - R;
  const x = t => L + (Math.min(Math.max(t, d0), d1) - d0) / 864e5 * span;
  // 症狀點太近時往下疊一層，避免重疊
  const r = 6, gap = 2 * r + 3, step = 15;
  const syms = db.symptoms.filter(s => { const t = ms(s.time); return t >= d0 && t < d1; }).sort((a, b) => ms(a.time) - ms(b.time));
  const levels = [], placed = syms.map(s => {
    const cx = x(ms(s.time));
    let k = levels.findIndex(last => cx - last >= gap);
    if (k < 0) { k = levels.length; levels.push(cx); } else levels[k] = cx;
    return { s, cx, k };
  });
  const nLv = Math.max(1, levels.length), symTop = 64, symH = 16 + nLv * step, H = symTop + symH + 8;
  let g = `<rect class="lane" x="${L}" y="24" width="${span}" height="32" rx="6"/><rect class="lane" x="${L}" y="${symTop}" width="${span}" height="${symH}" rx="6"/>`;
  g += `<text class="lanelbl" x="${L - 6}" y="44" text-anchor="end">吃飯</text><text class="lanelbl" x="${L - 6}" y="${symTop + symH / 2 + 4}" text-anchor="end">症狀</text>`;
  for (let hr = 0; hr <= 24; hr += 3) {
    const xx = L + hr / 24 * span;
    g += `<line class="grid" x1="${xx}" x2="${xx}" y1="20" y2="${H - 4}"/><text class="tick" x="${xx}" y="13" text-anchor="middle">${hr}</text>`;
  }
  db.meals.forEach(m => {
    const s = ms(m.start);
    const e = m.end ? ms(m.end) : (isActive(m) ? now : s + 15 * 60000);
    if (e < d0 || s >= d1) return;
    const x1 = x(s), x2 = Math.max(x(e), x1 + 4);
    const dash = (m.endUnknown || isActive(m)) ? 'stroke-dasharray="3 2" fill-opacity="0.5"' : '';
    g += `<rect class="tl-hit tl-meal" data-kind="m" data-id="${m.id}" x="${x1}" y="31" width="${x2 - x1}" height="18" rx="4" ${dash}><title>${esc(mealTimeText(m) + ' ' + mealText(m))}</title></rect>`;
  });
  placed.forEach(({ s, cx, k }) => {
    g += `<circle class="tl-hit tl-sym" data-kind="s" data-id="${s.id}" cx="${cx}" cy="${symTop + 8 + r + k * step}" r="${r}"><title>${esc(fmtHM(s.time) + ' ' + symText(s))}</title></circle>`;
  });
  if (now >= d0 && now < d1) g += `<line class="nowline" x1="${x(now)}" x2="${x(now)}" y1="20" y2="${H - 4}"/>`;
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${fmtDay(d0)} 的吃飯與症狀時間軸">${g}</svg>`;
}

/* ========== F5 規律度統計 + F6 相關 ========== */
let range = 7;
const SLOTS = [
  { k: 'b', name: '早餐', test: h => h >= 5 && h < 11 },
  { k: 'l', name: '午餐', test: h => h >= 11 && h < 16 },
  { k: 'd', name: '晚餐', test: h => h >= 16 && h < 21 },
  { k: 'n', name: '宵夜', test: h => h >= 21 || h < 5 }
];
const slotOf = d => SLOTS.find(s => s.test(new Date(d).getHours()));
const lateMin = d => { const h = new Date(d).getHours(); return minOfDay(d) + (h < 5 ? 1440 : 0); };
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const sd = a => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)); };

function renderStats() {
  const el = $('#page-stats'), now = Date.now(), today = startOfDay(now);
  const from = today - (range - 1) * 864e5;
  const meals = db.meals.filter(m => ms(m.start) >= from && !isActive(m));
  const syms = db.symptoms.filter(s => ms(s.time) >= from);
  const firstRec = Math.min(...[...db.meals.map(m => ms(m.start)), ...db.symptoms.map(s => ms(s.time))], now);
  const dayFrom = Math.max(from, startOfDay(firstRec));
  const days = []; for (let d = dayFrom; d <= today; d = startOfDay(d + 36 * 3600e3)) days.push(d);

  // 每個餐別
  const rows = SLOTS.map(sl => {
    const list = meals.filter(m => slotOf(m.start).k === sl.k);
    const mins = list.map(m => sl.k === 'n' ? lateMin(m.start) : minOfDay(m.start));
    const missed = sl.k === 'n' ? null : days.filter(d => !meals.some(m => slotOf(m.start).k === sl.k && startOfDay(m.start) === d)).length;
    return { sl, n: list.length, avg: mins.length ? fmtMin(mean(mins)) : '-', sd: sd(mins), missed };
  });
  const durs = meals.map(durMs).filter(x => x != null);
  const fulls = meals.map(m => m.fullness).filter(Boolean);
  const latest = meals.length ? meals.reduce((a, b) => lateMin(b.start) > lateMin(a.start) ? b : a) : null;

  let h = `<div class="card"><div class="card-title">統計範圍</div>
    <div class="seg" id="range">${[7, 14, 30].map(r => `<button data-r="${r}" class="${r === range ? 'on' : ''}">最近 ${r} 天</button>`).join('')}</div></div>`;

  h += `<div class="card"><div class="card-title meal">規律度<span class="hint">波動越小代表越規律</span></div>
    ${meals.length ? `<table class="slots"><tr><th>餐別</th><th>平均開始</th><th>波動</th><th>筆數</th><th>漏餐天數</th></tr>
      ${rows.map(r => `<tr><td>${r.sl.name}</td><td>${r.avg}</td><td>${r.sd == null ? '-' : '±' + Math.round(r.sd) + ' 分'}</td><td>${r.n}</td><td>${r.missed == null ? '-' : r.missed + ' / ' + days.length}</td></tr>`).join('')}</table>
    <div class="stat-grid" style="margin-top:12px">
      <div class="stat"><div class="v">${latest ? fmtHM(latest.start) : '-'}</div><div class="k">最晚一餐${latest ? '・' + fmtDay(latest.start) : ''}</div></div>
      <div class="stat"><div class="v">${durs.length ? Math.round(mean(durs) / 60000) + ' 分' : '-'}</div><div class="k">平均用餐時長</div></div>
      <div class="stat"><div class="v">${fulls.length ? mean(fulls).toFixed(1) : '-'}</div><div class="k">平均飽腹感（1～5）</div></div>
      <div class="stat"><div class="v">${syms.length}</div><div class="k">症狀次數</div></div>
    </div>` : '<p class="muted small empty">這段期間還沒有吃飯紀錄</p>'}
    <span class="label">每日症狀出現次數</span>${symBars(from, today, syms)}
  </div>`;
  h += SLOTS.map(sl => mealTrend(sl, from, today)).join('');

  h += corrSection();
  el.innerHTML = h;
  el.querySelectorAll('#range button').forEach(b => b.onclick = () => { range = +b.dataset.r; renderStats(); });
}
function mealTrend(sl, from, today) {
  const n = Math.round((today - from) / 864e5) + 1;
  const days = Array.from({ length: n }, (_, i) => startOfDay(from + i * 864e5 + 3600e3));
  const val = d => {
    // 宵夜的凌晨算前一天晚上
    const list = db.meals.filter(m => slotOf(m.start).k === sl.k && (sl.k === 'n' ? startOfDay(ms(m.start) - 5 * 3600e3) : startOfDay(m.start)) === d);
    if (!list.length) return null;
    return Math.min(...list.map(m => sl.k === 'n' ? lateMin(m.start) : minOfDay(m.start)));
  };
  const pts = days.map(d => ({ d, v: val(d) }));
  const vs = pts.filter(p => p.v != null).map(p => p.v);
  if (!vs.length) return '';
  const avg = mean(vs);
  let lo = Math.floor((Math.min(...vs) - 30) / 60) * 60, hi = Math.ceil((Math.max(...vs) + 30) / 60) * 60;
  if (hi - lo < 120) { const c = (hi + lo) / 2; lo = Math.floor((c - 60) / 60) * 60; hi = lo + 120; }
  const stepY = hi - lo <= 240 ? 60 : hi - lo <= 480 ? 120 : 180;
  const W = 360, H = 176, L = 42, Rr = 12, T = 12, B = 38, pw = W - L - Rr, ph = H - T - B;
  const X = i => L + (i + 0.5) * pw / n, Y = v => T + (hi - v) / (hi - lo) * ph;
  let g = '';
  for (let v = lo; v <= hi; v += stepY) g += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fmtMin(v)}</text>`;
  g += `<line x1="${L}" x2="${W - Rr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>`;
  let path = '', prev = null;
  pts.forEach((p, i) => {
    if (p.v == null) { prev = null; return; }

  download('gut-log-吃飯-' + day + '.csv', '\ufeff' + meals.join('\r\n'), 'text/csv');
  setTimeout(() => download('gut-log-症狀-' + day + '.csv', '\ufeff' + syms.join('\r\n'), 'text/csv'), 600);
  toast('已匯出兩個 CSV 檔');
}

/* ========== 分頁切換與啟動 ========== */
let current = 'home';
const TITLES = { home: '摘要', timeline: '時間軸', stats: '趨勢', settings: '設定' };
function renderHeader() {
  const d = new Date();
  $('#eyebrow').textContent = 'gut-log · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + WD[d.getDay()];
  $('#pageTitle').textContent = TITLES[current];
}
function renderCurrent() {
  renderHeader();
  ({ home: renderHome, timeline: renderTimeline, stats: renderStats, settings: renderSettings })[current]();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  current = b.dataset.page;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + current));
  if (current === 'timeline') tlDay = startOfDay(Date.now());
  renderCurrent(); window.scrollTo(0, 0);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (!sheetOpen) renderCurrent(); } });

// 啟動：打開網頁時不重複跳已錯過的通知，改由補登視窗處理
(function init() {
  const a = activeMeal();
  if (a) { a.notified = Math.max(a.notified || 0, dueCount(Date.now() - ms(a.start))); save(); }
  applyTheme(); renderHeader(); renderHome(); tick();
  setInterval(tick, 1000);
  checkStaleMeal();
  maybeAskSymptomDuration();
})();
</script>
</body>
